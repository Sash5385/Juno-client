name: Deploy to Firebase

on:
  push:
    branches:
      - ccr-0afc4178-9t5dvx
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy hosting to Firebase
        run: npx firebase-tools deploy --only hosting --project juno-booking --token "${{ secrets.FIREBASE_TOKEN }}"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drivepad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Після успішного деплою просимо репо aldemi перезібрати сайт aldemi.com.ua (/junoadmin, /junoclient).
  # Потрібен секрет ALDEMI_DISPATCH_TOKEN (fine-grained PAT на Sash5385/aldemi, Contents: Read and write);
  # без нього крок просто пропускається.
  notify-aldemi:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Запустити деплой aldemi.com.ua
        env:
          TOKEN: ${{ secrets.ALDEMI_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "ALDEMI_DISPATCH_TOKEN не задано — пропущено"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Sash5385/aldemi/dispatches -d '{"event_type":"juno-updated"}'
