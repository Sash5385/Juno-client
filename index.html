<!DOCTYPE html>
<html lang="uk" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1c1d21" />
    <meta name="description" content="Juno — онлайн-запис для майстрів. Стандартні та індивідуальні записи." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juno" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Juno — Запис на записи</title>
    <script>
      // Палітра й режим застосовуємо до першого малювання (див. hooks/useTheme.js)
      try {
        var p = localStorage.getItem('palette'); if (p !== 'ocean' && p !== 'classic') p = 'neon';
        document.documentElement.setAttribute('data-palette', p);
        var t = localStorage.getItem('theme'); if (t !== 'light') t = 'dark';
        document.addEventListener('DOMContentLoaded', function () { document.body.setAttribute('data-theme', t); });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
